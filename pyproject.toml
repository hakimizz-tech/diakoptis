[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asterfusion-cli"
version = "0.1.0"
description = "Interactive troubleshooting CLI for Asterfusion (AsterNOS/SONiC) switches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Network Engineering Team", email = "joshuakim408@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies needed to run the CLI
dependencies = [
    "prompt-toolkit>=3.0.0", # Interactive shell framework
    "netmiko>=4.3.0",        # SSH connection manager (includes asterfusion_asternos driver)
    "rich>=13.0.0",          # Terminal formatting and tables
    "textfsm>=1.1.3",        # Raw output parser
    "pyyaml>=6.0",           # Configuration and inventory loading
]

[project.optional-dependencies]
# Install dev tools with: pip install -e ".[dev]"
dev = [
    "pytest>=7.0",           # Unit and integration testing
    "pytest-cov>=4.0",       # Test coverage
    "python-dotenv>=1.0.0",  # Load environment variables from .env files
    "ruff>=0.1.0",           # Fast linter and code formatter
    "mypy>=1.5.0",           # Static type checking
]

[project.scripts]
# This creates a terminal command called 'aster-cli' that users can run from anywhere
aster-cli = "asterfusion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["asterfusion*"]

# Tool Configurations

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=asterfusion"
testpaths = [
    "tests",
]
# Mark tests that require a real switch so they can be skipped in normal CI
markers = [
    "live_switch: tests that require SSH access to a real lab switch",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Useful since netmiko/textfsm might lack robust type stubs