---
# Asterfusion CLI - Command Map
# Maps friendly, task-oriented CLI commands to native AsterNOS/SONiC syntax.
#
# Schema:
#   friendly_command:
#     description: Help text displayed in the interactive shell.
#     native:      List of native switch commands to execute. Supports python 
#                  string formatting for dynamic arguments (e.g., {interface}).
#     parse:       How to parse the output: 
#                  - 'textfsm:<filename>' to use a TextFSM template
#                  - 'raw' to return unparsed text (good for logs)



# Interface Commands
show_interfaces:
  description: "Display the operational status and physical state of all interfaces."
  native: 
    - "show interface status"
  parse: "textfsm:sonic_show_interface_status.textfsm"

show_interface_errors:
  description: "Display error counters (CRC, drops) for all interfaces."
  native: 
    - "show interface counters errors"
  parse: "textfsm:sonic_show_interface_counters_errors.textfsm"

# Example of a parameterized command where the user types: 
# `check interface Ethernet0`
check_interface:
  description: "Deep dive into a specific interface's configuration and counters."
  native:
    - "show interface {interface}"
    - "show interface {interface} counters"
    - "show interface {interface} transceiver"
  parse: "raw"

# Routing / BGP Commands
check_bgp:
  description: "Check the status of all BGP neighbors and summary data."
  native: 
    - "show ip bgp summary"
  parse: "textfsm:sonic_show_ip_bgp_summary.textfsm"

check_bgp_neighbor:
  description: "Check detailed BGP state for a specific neighbor IP."
  native:
    - "show ip bgp neighbor {neighbor_ip}"
  parse: "textfsm:sonic_show_ip_bgp_neighbor.textfsm"

# Layer 2 Commands
check_vlan:
  description: "Display a brief summary of all VLANs and their member ports."
  native: 
    - "show vlan brief"
  parse: "textfsm:sonic_show_vlan_brief.textfsm"

check_mac:
  description: "Look up a specific MAC address in the forwarding database."
  native:
    - "show mac address-table address {mac_address}"
  parse: "textfsm:sonic_show_mac.textfsm"

# System & Diagnostics
show_logs:
  description: "Tail the recent system logs."
  native: 
    - "show logging"
  parse: "raw"

show_version:
  description: "Display AsterNOS system version, hardware info, and uptime."
  native:
    - "show version"
  parse: "textfsm:sonic_show_version.textfsm"