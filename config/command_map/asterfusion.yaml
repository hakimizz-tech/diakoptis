# config/command_map/asterfusion.yaml
#
# Vendor command map: Asterfusion (AsterNOS / sonic-cli)
# Parsing strategy for now: ntc-templates only, or explicit raw — see plan.md §10.
#
# `parse` is one of:
#   raw                          -> never structured, return as-is (see parser.py)
#   ntc                          -> Output Parser -> ntc-templates via device_type as
#                                    platform, no local template exists yet
#   <vendor>/<file>.textfsm      -> a LOCAL template path, relative to OutputParser's
#                                    templates_root (which already points at .../parsing/
#                                    templates/ — don't repeat "templates/" here, see the
#                                    "MISSING TEMPLATES" note below for what's referenced
#                                    but not yet written)
#
# `ntc_override:` is an optional, EXPLICIT structured field — {platform, command} — used
# only when ntc-templates needs to match a different (platform, command) pair than the
# literal native command sent to the switch. This replaced an earlier embedded-string
# attempt ("ntc:cisco_ios:show ..."), which the parser doesn't understand and which was
# silently discarded rather than applied (see parser.py's parse_command docstring).
# CAUTION: an override borrows a template built for a different vendor's *column layout*,
# not just its command name — treat every override here as unverified until checked
# against real captured Asterfusion output, not as "working" parsing.
#
# Friendly command names are kept identical to command_map/huawei_vrp.yaml wherever the
# same functionality exists — the point of this map is that "check bgp" means the same
# thing to the operator regardless of which switch answers it (plan.md §9).
#
# MISSING LOCAL TEMPLATES (referenced below, not yet created — see plan.md §10 graduation
# path): sonic_show_interface_status.textfsm, sonic_show_environment.textfsm,
# sonic_show_system_cpu_usage.textfsm, sonic_show_system_memory_usage.textfsm,
# sonic_show_system_disk_usage.textfsm. Every entry pointing at one of these will raise
# ParserError (file referenced but missing is a bug, not a graceful "no template" case) —
# do not deploy until these exist or the entries are reverted to `parse: ntc`.
#
# Native commands are illustrative — verify against docs.asternos.com or `?`/Tab-completion
# on real hardware. `check_cpu`/`check_memory`/`check_disk` in particular use command names
# not confirmed anywhere in SONiC/AsterNOS documentation found so far — resource stats on
# SONiC-based platforms are often reached differently (e.g. `show system-memory`, or outside
# sonic-cli entirely) — verify these before relying on them at all.

# -- Hardware / Environment ----------------------------------------------------

# TODO (carried over, unresolved): rename/restructure to check_power specifically, or keep
# as a combined environment check covering fans+power+temperature? Decide before local
# template is written, since the template's structure depends on this.
check_environment:
  description: "Check system hardware health (fans, power supplies, temperature)"
  native: ["show environment all"]
  parse: asterfusion/sonic_show_environment.textfsm   

check_optics:
  description: "Show optical transceiver DOM/DDM levels (Tx/Rx power) for all ports"
  # CORRECTED: "show interface transceiver lpmode" reports low-power-mode state, not
  # DOM/DDM levels — per SONiC's own command reference, "show interface transceiver info"
  # (or "... eeprom" for full DOM detail) is the command that actually matches this
  # description. Verify the exact AsterNOS equivalent before relying on it.
  native: ["show interface transceiver info"]
  parse: raw   # DOM/DDM output is verbose per-port paragraph text, not a clean table

check_optics_port:
  description: "Show optical DOM/DDM levels for a specific port (e.g. check optics_port Ethernet4)"
  # NOTE: {target} substitution is not implemented in the Resolver yet — this entry is a
  # design placeholder for parameterized commands, not runnable as-is.
  native: ["show interface {target} transceiver"]
  parse: raw   # verbose paragraph output breaks tables; must remain raw regardless

# -- Layer 2 / Switching (Interfaces, MAC, LLDP, LAG) ---------------------------

show_interfaces:
  description: "Show general interface operational status"
  native: ["show interface status"]
  parse: asterfusion/sonic_show_interface_status.textfsm   

show_interface_errors:
  description: "Show CRC, frame, and physical layer errors"
  native: ["show interface counters errors"]
  parse: ntc
  # Prior version forced ntc_override: {platform: cisco_ios, command: "show interface
  # counters errors"}. Left off here: Cisco's counters-errors template expects Cisco's own
  # column layout, which sonic-cli's error counters table does not match — a header regex
  # hit with a data-row mismatch is a worse outcome than an honest raw fallback.

check_lag:
  description: "Verify port-channel / LACP bundle status"
  native: ["show portchannel summary"]
  parse: raw

show_lldp_neighbors:
  description: "Show connected neighbors via LLDP"
  native: ["show lldp neighbors"]
  parse: ntc

show_mac_table:
  description: "Show MAC address table"
  native: ["show mac"]
  parse: ntc
  ntc_override:
    platform: cisco_ios
    command: "show mac-address-table"
  # This is exactly the case ntc_override exists for: "show mac" won't match ntc's
  # "show mac-address-table" command regex on its own. Still unverified against real
  # column layout — confirm before trusting the structured result over raw.

check_vlan:
  description: "Show VLAN configuration and member ports"
  native: ["show vlan brief"]
  parse: ntc

# -- Layer 3 / Routing & Forwarding (FRRouting engine) --------------------------

show_arp:
  description: "Show the ARP cache (IP to MAC mapping)"
  native: ["show arp"]
  parse: raw

show_route:
  description: "Show the global routing table"
  native: ["show ip route"]
  parse: ntc

check_bgp:
  description: "Check BGP peer state and prefix counts"
  native: ["show ip bgp summary"]
  parse: ntc

check_bgp_neighbor:
  description: "Deep dive into a specific BGP neighbor (e.g. check bgp_neighbor 10.0.0.1)"
  # NOTE: same {target} caveat as check_optics_port — not runnable until the Resolver
  # supports argument substitution.
  native: ["show ip bgp neighbors {target}"]
  parse: ntc

# -- System / Admin (CPU, Memory, Logs) -----------------------------------------

check_cpu:
  description: "Check system CPU utilization"
  native: ["show system cpu-usage"]   # UNVERIFIED — see header caveat
  parse: asterfusion/sonic_show_system_cpu_usage.textfsm   

check_memory:
  description: "Check system RAM utilization"
  native: ["show system memory-usage"]   # UNVERIFIED — see header caveat
  parse: asterfusion/sonic_show_system_memory_usage.textfsm   # MISSING

check_disk:
  description: "Check system disk utilization"
  native: ["show system disk-usage"]   # UNVERIFIED — see header caveat
  parse: asterfusion/sonic_show_system_disk_usage.textfsm   # MISSING

show_logs:
  description: "Show recent system syslog messages"
  native: ["show logging"]
  parse: raw   # logs should never be forced into tables

show_version:
  description: "Show OS version, uptime, and system serial numbers"
  native: ["show version"]
  parse: ntc